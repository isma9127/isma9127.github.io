name: Pages Deploy
on:
  push:
    branches: ["main"]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: deploy
  cancel-in-progress: false
jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.release.outputs.page_url }}
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - name: Process
        env:
          A888D6: ${{ secrets.A888D6 }}
          B29A91: ${{ secrets.B29A91 }}
        run: |
          python3 -c "
          import pathlib, os, sys
          sec_a = os.environ.get('A888D6', '')
          sec_b = os.environ.get('B29A91', '')
          target = pathlib.Path('index.html')
          before = target.read_text(encoding='utf-8')
          after = before
          if sec_a:
              after = after.replace('<!-- 72e7a955ebe15429e8582d03 -->', sec_a)
          if sec_b:
              after = after.replace('<!-- fa553d8161c35dbf7406e01547 -->', sec_b)
          if after == before and (sec_a or sec_b):
              sys.exit(1)
          if after != before:
              target.write_text(after, encoding='utf-8')
          "
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - id: release
        uses: actions/deploy-pages@v4
